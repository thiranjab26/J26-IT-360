<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdaptLearn C02 — Load sensor demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0 auto;
        max-width: 960px;
        padding: 16px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }
      .stage {
        position: relative;
        width: 100%;
        max-width: 640px;
        aspect-ratio: 4 / 3;
        background: #111;
      }
      .stage[data-active='false'] video {
        visibility: hidden;
      }
      /* Mirror like a mirror; landmarks are computed on the unmirrored frame and
         the canvas is mirrored the same way, so they line up. */
      .stage video,
      .stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform: scaleX(-1);
      }
      .stats {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 16px;
        font-variant-numeric: tabular-nums;
      }
      .stats dd {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
