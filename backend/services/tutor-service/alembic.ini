# Alembic configuration for tutor-service. Migrates the `content` and `tutor`
# schemas only; the version table lives in `tutor`.
#
#   cd backend/services/tutor-service
#   uv run alembic upgrade head
#
# The connection string comes from TUTOR_MIGRATION_DATABASE_URL (falling back to
# DATABASE_URL) in .env, read by migrations/env.py through app.config.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
