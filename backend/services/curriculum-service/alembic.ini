# Alembic for the `curriculum` schema only (C1). The database URL is not kept
# here: migrations/env.py reads CURRICULUM_MIGRATION_DATABASE_URL (Neon DIRECT
# endpoint) from .env, falling back to DATABASE_URL.
#
#   uv run alembic upgrade head          apply migrations (writes to the database)
#   uv run alembic upgrade head --sql    print the SQL only (writes nothing)

[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
