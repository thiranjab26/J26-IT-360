# C2 load sensor: typecheck, lint (incl. privacy rules) and unit tests.
# Path-filtered so it runs only when C2's package or the shared lockfile changes.
name: c2-load-sensor

on:
  push:
    paths:
      - 'packages/load-sensor/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/c2-load-sensor.yml'
  pull_request:
    paths:
      - 'packages/load-sensor/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/c2-load-sensor.yml'

permissions:
  contents: read

concurrency:
  group: c2-load-sensor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/load-sensor
    steps:
      # Actions pinned to commit SHAs; the tag is noted for updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter @adaptlearn/load-sensor...

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (ESLint incl. privacy rules, Prettier)
        run: pnpm lint

      - name: Unit tests
        run: pnpm test
